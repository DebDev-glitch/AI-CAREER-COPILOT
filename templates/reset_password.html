{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card forgot-card">

        <div class="auth-icon">
            🔐
        </div>

        <h2>Change Password</h2>

        <p class="sub-text">
            Create a new password for your account.
        </p>

        <form method="POST" id="resetForm">

            {% if error %}
            <div class="form-error">
                {{ error }}
            </div>
            {% endif %}

            <label for="new_password">
                New Password
            </label>

            <div class="password-field">

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    placeholder="Create a new password"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('new_password', this)"
                >
                    Show
                </button>

            </div>

            <div class="password-requirements">

                <p class="requirement" id="resetLength">
                    <span class="requirement-icon">✗</span>
                    At least 6 characters
                </p>

                <p class="requirement" id="resetUppercase">
                    <span class="requirement-icon">✗</span>
                    One uppercase letter
                </p>

                <p class="requirement" id="resetSpecial">
                    <span class="requirement-icon">✗</span>
                    One special character
                </p>

            </div>

            <label for="confirm_password">
                Confirm New Password
            </label>

            <div class="password-field">

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your new password"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('confirm_password', this)"
                >
                    Show
                </button>

            </div>

            <p class="password-match" id="passwordMatch"></p>

            <button type="submit">
                Change Password
                <span class="button-arrow">→</span>
            </button>

        </form>

        <p class="switch-auth">
            <a href="/login">Back to Login</a>
        </p>

    </div>

</div>


<script>

const newPassword = document.getElementById("new_password");
const confirmPassword = document.getElementById("confirm_password");

const resetLength = document.getElementById("resetLength");
const resetUppercase = document.getElementById("resetUppercase");
const resetSpecial = document.getElementById("resetSpecial");

const passwordMatch = document.getElementById("passwordMatch");
const resetForm = document.getElementById("resetForm");


function updateRequirement(element, valid) {

    const icon = element.querySelector(".requirement-icon");

    if (valid) {
        element.classList.add("valid");
        icon.textContent = "✓";
    } else {
        element.classList.remove("valid");
        icon.textContent = "✗";
    }
}


newPassword.addEventListener("input", function () {

    const password = newPassword.value;

    const hasMinimumLength = password.length >= 6;
    const hasUppercase = /[A-Z]/.test(password);
    const hasSpecialCharacter = /[^A-Za-z0-9]/.test(password);

    updateRequirement(
        resetLength,
        hasMinimumLength
    );

    updateRequirement(
        resetUppercase,
        hasUppercase
    );

    updateRequirement(
        resetSpecial,
        hasSpecialCharacter
    );

    newPassword.classList.toggle(
        "valid-input",
        hasMinimumLength &&
        hasUppercase &&
        hasSpecialCharacter
    );

    checkPasswordMatch();

});


confirmPassword.addEventListener(
    "input",
    checkPasswordMatch
);


function checkPasswordMatch() {

    if (!confirmPassword.value) {
        passwordMatch.textContent = "";
        confirmPassword.classList.remove("valid-input");
        return;
    }

    if (newPassword.value === confirmPassword.value) {

        passwordMatch.textContent = "✓ Passwords match";
        passwordMatch.classList.add("match-success");
        passwordMatch.classList.remove("match-error");

        confirmPassword.classList.add("valid-input");

    } else {

        passwordMatch.textContent = "✗ Passwords do not match";
        passwordMatch.classList.add("match-error");
        passwordMatch.classList.remove("match-success");

        confirmPassword.classList.remove("valid-input");
    }
}


resetForm.addEventListener("submit", function (event) {

    const password = newPassword.value;

    const validLength = password.length >= 6;
    const validUppercase = /[A-Z]/.test(password);
    const validSpecial = /[^A-Za-z0-9]/.test(password);

    if (
        !validLength ||
        !validUppercase ||
        !validSpecial ||
        password !== confirmPassword.value
    ) {

        event.preventDefault();

        alert(
            "Please satisfy all password requirements before changing your password."
        );
    }

});


function togglePassword(inputId, button) {

    const input = document.getElementById(inputId);

    if (input.type === "password") {

        input.type = "text";
        button.textContent = "Hide";

    } else {

        input.type = "password";
        button.textContent = "Show";
    }
}

</script>

{% endblock %}
