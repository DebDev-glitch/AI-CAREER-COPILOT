{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card signup-card">

        <div class="auth-icon">
            ✨
        </div>

        <h2>Create Account</h2>

        <p class="sub-text">
            Start your AI career journey
        </p>

        <form method="POST" id="signupForm">

            {% if error %}
            <div class="form-error">
                {{ error }}
            </div>
            {% endif %}

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Choose a username"
                autocomplete="username"
                minlength="3"
                maxlength="50"
                required
            >

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <div class="password-field">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('password', this)"
                >
                    Show
                </button>

            </div>

            <div class="password-requirements">

                <p class="requirement" id="lengthRequirement">
                    <span class="requirement-icon">✗</span>
                    At least 6 characters
                </p>

                <p class="requirement" id="uppercaseRequirement">
                    <span class="requirement-icon">✗</span>
                    One uppercase letter
                </p>

                <p class="requirement" id="specialRequirement">
                    <span class="requirement-icon">✗</span>
                    One special character
                </p>

            </div>

            <button type="submit" id="signupButton">
                Create Account
                <span class="button-arrow">→</span>
            </button>

        </form>

        <div class="auth-divider">
            <span>Already have an account?</span>
        </div>

        <p class="switch-auth">
            <a href="/login">Log In</a>
        </p>

    </div>

</div>


<script>

const passwordInput = document.getElementById("password");
const signupForm = document.getElementById("signupForm");

const lengthRequirement =
    document.getElementById("lengthRequirement");

const uppercaseRequirement =
    document.getElementById("uppercaseRequirement");

const specialRequirement =
    document.getElementById("specialRequirement");


function updateRequirement(element, valid) {

    const icon = element.querySelector(".requirement-icon");

    if (valid) {
        element.classList.add("valid");
        icon.textContent = "✓";
    } else {
        element.classList.remove("valid");
        icon.textContent = "✗";
    }
}


passwordInput.addEventListener("input", function () {

    const password = passwordInput.value;

    const hasMinimumLength =
        password.length >= 6;

    const hasUppercase =
        /[A-Z]/.test(password);

    const hasSpecialCharacter =
        /[^A-Za-z0-9]/.test(password);

    updateRequirement(
        lengthRequirement,
        hasMinimumLength
    );

    updateRequirement(
        uppercaseRequirement,
        hasUppercase
    );

    updateRequirement(
        specialRequirement,
        hasSpecialCharacter
    );

    const allValid =
        hasMinimumLength &&
        hasUppercase &&
        hasSpecialCharacter;

    passwordInput.classList.toggle(
        "valid-input",
        allValid
    );

});


signupForm.addEventListener("submit", function (event) {

    const password = passwordInput.value;

    const validLength =
        password.length >= 6;

    const validUppercase =
        /[A-Z]/.test(password);

    const validSpecial =
        /[^A-Za-z0-9]/.test(password);

    if (
        !validLength ||
        !validUppercase ||
        !validSpecial
    ) {

        event.preventDefault();

        alert(
            "Please satisfy all password requirements before creating your account."
        );
    }

});


function togglePassword(inputId, button) {

    const input =
        document.getElementById(inputId);

    if (input.type === "password") {

        input.type = "text";
        button.textContent = "Hide";

    } else {

        input.type = "password";
        button.textContent = "Show";

    }
}

</script>

{% endblock %}
